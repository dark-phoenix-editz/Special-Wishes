<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Celebration 💙</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    height:100vh;
    overflow:hidden;
    background:#010611;
    color:white;
    font-family:Arial,sans-serif;
}

.star{
    position:fixed;
    width:3px;height:3px;
    background:#7ddcff;
    border-radius:50%;
    box-shadow:0 0 8px #00aaff;
    animation:twinkle 1.5s infinite alternate;
}

@keyframes twinkle{
    to{opacity:1;transform:scale(1.5)}
}

.instruction{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
}

.instruction h2{
    color:#e9f8ff;
    text-shadow:0 0 20px #008cff;
}

.instruction p{
    margin-top:8px;
    color:#8fbddd;
}

.lamps{
    height:250px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:50px;
    padding-top:30px;
}

.lamp-container{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.wire{
    width:3px;
    height:70px;
    background:#526174;
}

.lamp{
    width:45px;
    height:55px;
    border-radius:50%;
    background:#182332;
    border:3px solid #526174;
    box-shadow:inset 0 0 15px #000;
    transition:.5s;
}

.lamp.lit{
    background:#75dcff;
    border-color:#dff8ff;
    box-shadow:
        0 0 10px #75dcff,
        0 0 30px #00aaff,
        0 0 70px #0077ff;
}

.candle-area{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.candle{
    width:35px;
    height:80px;
    background:linear-gradient(90deg,#bdeeff,#fff,#8bd5ff);
    border-radius:7px;
    cursor:grab;
    touch-action:none;
}

.flame{
    width:20px;
    height:30px;
    position:absolute;
    top:-32px;
    left:50%;
    transform:translateX(-50%) rotate(45deg);
    background:#65d8ff;
    border-radius:50% 50% 50% 0;
    box-shadow:0 0 10px #65d8ff,0 0 30px #008cff;
    animation:flame .5s infinite alternate;
}

@keyframes flame{
    to{transform:translateX(-50%) rotate(50deg) scale(1.1)}
}

.drag-text{
    margin-top:12px;
    color:#83cfff;
    font-size:12px;
}

#fireworks{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.birthday{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    opacity:0;
    transform:scale(.7);
    transition:1s;
    pointer-events:none;
    text-align:center;
}

.birthday.show{
    opacity:1;
    transform:scale(1);
}

.birthday h1{
    font-size:clamp(40px,8vw,90px);
    color:white;
    text-shadow:0 0 20px #fff,0 0 50px #008cff;
}

.birthday h2{
    margin-top:10px;
    color:#4dc5ff;
    font-size:clamp(25px,5vw,60px);
    text-shadow:0 0 30px #008cff;
}

.birthday p{
    margin-top:15px;
    color:#a9ddff;
}
</style>
</head>

<body>

<div id="stars"></div>
<canvas id="fireworks"></canvas>

<div class="instruction">
    <h2>Light the Lamps 💙</h2>
    <p>Drag the candle and light all five lamps</p>
</div>

<div class="lamps">

    <div class="lamp-container">
        <div class="wire"></div>
        <div class="lamp"></div>
    </div>

    <div class="lamp-container">
        <div class="wire"></div>
        <div class="lamp"></div>
    </div>

    <div class="lamp-container">
        <div class="wire"></div>
        <div class="lamp"></div>
    </div>

    <div class="lamp-container">
        <div class="wire"></div>
        <div class="lamp"></div>
    </div>

    <div class="lamp-container">
        <div class="wire"></div>
        <div class="lamp"></div>
    </div>

</div>

<div class="candle-area">
    <div class="candle" id="candle">
        <div class="flame"></div>
    </div>
    <div class="drag-text">HOLD & DRAG</div>
</div>

<div class="birthday" id="birthday">
    <h1>Happy Birthday</h1>
    <h2 id="name">💙</h2>
    <p>Wishing you a beautiful day filled with happiness ✨</p>
</div>

<script>

for(let i=0;i<100;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.animationDelay=Math.random()*2+"s";
    document.getElementById("stars").appendChild(s);
}

let saved=localStorage.getItem("birthdayName");
document.getElementById("name").textContent=
    saved ? saved+" 💙" : "Beautiful Soul 💙";

const candle=document.getElementById("candle");
const lamps=document.querySelectorAll(".lamp");

let dragging=false,dx,dy,count=0,done=false;

candle.onpointerdown=e=>{
    dragging=true;
    candle.setPointerCapture(e.pointerId);

    let r=candle.getBoundingClientRect();
    dx=e.clientX-r.left;
    dy=e.clientY-r.top;

    candle.style.position="fixed";
    candle.style.left=r.left+"px";
    candle.style.top=r.top+"px";
};

candle.onpointermove=e=>{
    if(!dragging)return;

    candle.style.left=e.clientX-dx+"px";
    candle.style.top=e.clientY-dy+"px";

    lamps.forEach(lamp=>{
        if(lamp.classList.contains("lit"))return;

        let a=candle.getBoundingClientRect();
        let b=lamp.getBoundingClientRect();

        if(
            a.left<b.right &&
            a.right>b.left &&
            a.top<b.bottom &&
            a.bottom>b.top
        ){
            lamp.classList.add("lit");
            count++;

            if(count===5) celebration();
        }
    });
};

candle.onpointerup=e=>{
    dragging=false;
    candle.releasePointerCapture(e.pointerId);

    candle.style.position="absolute";
    candle.style.left="50%";
    candle.style.top="";
};

function celebration(){

    if(done)return;
    done=true;

    document.querySelector(".instruction").style.opacity=0;

    fireworks=true;
    animate();

    setTimeout(()=>{
        document.getElementById("birthday")
        .classList.add("show");
    },3000);
}

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
onresize=resize;

let fireworks=false;
let rockets=[];
let particles=[];

function rocket(){

    rockets.push({
        x:Math.random()*canvas.width,
        y:canvas.height,
        target:Math.random()*canvas.height*.4,
        color:`hsl(${Math.random()*360},100%,65%)`
    });
}

function explode(r){

    for(let i=0;i<60;i++){

        let a=Math.random()*Math.PI*2;
        let s=Math.random()*6+2;

        particles.push({
            x:r.x,y:r.y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            life:1,
            color:r.color
        });
    }
}

function animate(){

    if(!fireworks)return;

    ctx.fillStyle="rgba(1,6,17,.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    rockets.forEach((r,i)=>{

        r.y-=8;

        ctx.fillStyle=r.color;
        ctx.fillRect(r.x,r.y,3,3);

        if(r.y<r.target){
            explode(r);
            rockets.splice(i,1);
        }
    });

    particles.forEach((p,i)=>{

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=.05;
        p.life-=.015;

        ctx.globalAlpha=p.life;
        ctx.fillStyle=p.color;

        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fill();

        if(p.life<=0)
            particles.splice(i,1);
    });

    ctx.globalAlpha=1;
    requestAnimationFrame(animate);
}
setInterval(()=>{
    if(fireworks)rocket();
},500);
</script>
</body>
</html>
