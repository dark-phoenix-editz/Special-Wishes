<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Celebration 💙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(0, 120, 255, 0.18),
                    transparent 50%
                ),
                #010611;

            color: white;

            font-family: "DM Sans", sans-serif;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;

            width: 3px;
            height: 3px;

            background: #7ddcff;

            border-radius: 50%;

            box-shadow:
                0 0 6px #00aaff,
                0 0 15px #0077ff;

            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {

            from {
                opacity: 0.2;
                transform: scale(0.6);
            }

            to {
                opacity: 1;
                transform: scale(1.4);
            }
        }


        .scene {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }

        .instruction {

            position: absolute;

            top: 45px;

            text-align: center;

            z-index: 10;
        }

        .instruction h2 {

            font-family: "Playfair Display", serif;

            font-size: 32px;

            color: #e9f8ff;

            text-shadow:
                0 0 10px #008cff,
                0 0 25px #006eff;
        }

        .instruction p {

            margin-top: 8px;

            color: #8fbddd;

            font-size: 14px;

            letter-spacing: 0.5px;
        }

        .lamps {

            display: flex;

            justify-content: center;

            align-items: flex-end;

            gap: 55px;

            margin-bottom: 75px;

            z-index: 5;
        }

        .lamp-container {

            display: flex;

            flex-direction: column;

            align-items: center;

            position: relative;
        }


        .wire {

            width: 3px;

            height: 45px;

            background: #25354c;

            box-shadow: 0 0 4px #17263a;
        }


        .lamp {

            position: relative;

            width: 80px;

            height: 72px;

            transform: rotate(-45deg);

            background: #152235;

            border: 3px solid #30445d;

            border-radius:
                50% 50% 0 50%;

            transition: 0.6s;

            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.4);
        }

        .lamp::before,
        .lamp::after {

            content: "";

            position: absolute;

            width: 80px;

            height: 72px;

            background: inherit;

            border: inherit;

            border-radius: 50%;
        }

        .lamp::before {

            top: -42px;

            left: -3px;

            border-bottom: none;
        }

        .lamp::after {

            left: 39px;

            top: 0;

            border-left: none;
        }

        .lamp-glow {

            position: absolute;

            inset: 0;

            transform: rotate(45deg);

            z-index: 5;

            pointer-events: none;
        }


        .lamp.lit {

            background: #087cff;

            border-color: #72d7ff;

            box-shadow:

                0 0 10px #00aaff,
                0 0 25px #008cff,
                0 0 55px #006eff,
                0 0 90px rgba(0,140,255,0.7);

            animation: lampPulse 1.5s infinite alternate;
        }

        .lamp.lit::before,
        .lamp.lit::after {

            background: #087cff;

            border-color: #72d7ff;
        }

        @keyframes lampPulse {

            from {
                filter: brightness(0.9);
            }

            to {
                filter: brightness(1.3);
            }
        }


        .candle-area {

            position: absolute;

            bottom: 45px;

            display: flex;

            flex-direction: column;

            align-items: center;

            z-index: 20;
        }

        .candle {

            position: relative;

            width: 38px;

            height: 90px;

            border-radius: 8px 8px 5px 5px;

            background:
                linear-gradient(
                    90deg,
                    #d9f5ff,
                    #ffffff,
                    #a8ddff
                );

            box-shadow:
                0 0 10px rgba(0,170,255,0.5);

            cursor: grab;

            user-select: none;

            touch-action: none;

            transition: transform 0.15s;
        }

        .candle:active {

            cursor: grabbing;

            transform: scale(1.05);
        }

        .wick {

            position: absolute;

            width: 4px;
            height: 10px;

            background: #111;

            top: -9px;

            left: 50%;

            transform: translateX(-50%);
        }

        .flame {

            position: absolute;

            width: 23px;
            height: 32px;

            top: -38px;

            left: 50%;

            transform:
                translateX(-50%)
                rotate(45deg);

            border-radius:
                50% 50% 50% 0;

            background: #65d8ff;

            box-shadow:

                0 0 8px #65d8ff,
                0 0 20px #009dff,
                0 0 40px #0077ff;

            animation: flame 0.6s infinite alternate;
        }

        @keyframes flame {

            from {
                transform:
                    translateX(-50%)
                    rotate(42deg)
                    scale(0.9);
            }

            to {
                transform:
                    translateX(-50%)
                    rotate(48deg)
                    scale(1.1);
            }
        }

        .drag-text {

            margin-top: 15px;

            color: #83cfff;

            font-size: 13px;

            letter-spacing: 1px;
        }


        #fireworks {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 2;
        }

        .birthday {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            pointer-events: none;

            opacity: 0;

            transform: scale(0.7);

            z-index: 50;

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;
        }

        .birthday.show {

            opacity: 1;

            transform: scale(1);
        }

        .birthday h1 {

            font-family: "Playfair Display", serif;

            font-size: clamp(45px, 8vw, 90px);

            color: #f1fbff;

            text-shadow:

                0 0 10px #ffffff,
                0 0 25px #00aaff,
                0 0 50px #0077ff,
                0 0 90px #006eff;
        }

        .birthday h2 {

            margin-top: 10px;

            font-family: "Playfair Display", serif;

            font-size: clamp(30px, 5vw, 60px);

            color: #4dc5ff;

            text-shadow:

                0 0 15px #008cff,
                0 0 35px #006eff;
        }

        .birthday p {

            margin-top: 20px;

            font-size: 16px;

            letter-spacing: 2px;

            color: #a9ddff;
        }

        @media(max-width: 750px) {
            .lamps {

                gap: 22px;

                transform: scale(0.75);
            }
            .instruction h2 {

                font-size: 25px;
            }
        }

        @media(max-width: 500px) {

            .lamps {

                gap: 8px;

                transform: scale(0.55);
            }

            .instruction {

                top: 35px;
            }
        }

    </style>
</head>

<body>

    <div class="stars" id="stars"></div>

    <canvas id="fireworks"></canvas>

    <div class="scene">


        <div class="instruction">

            <h2>Light the Hearts 💙</h2>

            <p>
                Drag the candle and light all five hearts
            </p>

        </div>


        <div class="lamps" id="lamps">

            <div class="lamp-container">
                <div class="wire"></div>
                <div class="lamp" data-lamp="0"></div>
            </div>

            <div class="lamp-container">
                <div class="wire"></div>
                <div class="lamp" data-lamp="1"></div>
            </div>

            <div class="lamp-container">
                <div class="wire"></div>
                <div class="lamp" data-lamp="2"></div>
            </div>

            <div class="lamp-container">
                <div class="wire"></div>
                <div class="lamp" data-lamp="3"></div>
            </div>

            <div class="lamp-container">
                <div class="wire"></div>
                <div class="lamp" data-lamp="4"></div>
            </div>

        </div>

        <div class="candle-area">

            <div
                class="candle"
                id="candle"
            >

                <div class="wick"></div>

                <div class="flame"></div>

            </div>

            <div class="drag-text">
                HOLD & DRAG
            </div>

        </div>

    </div>

    <div
        class="birthday"
        id="birthday"
    >

        <h1>Happy Birthday</h1>

        <h2 id="birthdayName">
            💙
        </h2>

        <p>
            Wishing you a beautiful day filled with happiness ✨
        </p>

    </div>
    <script>

        const stars =
            document.getElementById("stars");

        for (let i = 0; i < 100; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 2 + "s";

            stars.appendChild(star);
        }

        const savedName =
            localStorage.getItem("birthdayName");
        const birthdayName =
            document.getElementById("birthdayName");
        if (savedName) {
            birthdayName.textContent =
                savedName + " 💙";
        } else {
            birthdayName.textContent =
                "Beautiful Soul 💙";
        }
        const candle =
            document.getElementById("candle");
        const lamps =
            document.querySelectorAll(".lamp");
        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;
        let originalX = 0;
        let originalY = 0;
        candle.addEventListener(
            "pointerdown",
            function(e) {
                dragging = true;
                candle.setPointerCapture(e.pointerId);
                const rect =
                    candle.getBoundingClientRect();
                offsetX =
                    e.clientX - rect.left;
                offsetY =
                    e.clientY - rect.top;
                originalX =
                    rect.left;
                originalY =
                    rect.top;
                candle.style.position = "fixed";
                candle.style.left =
                    rect.left + "px";
                candle.style.top =
                    rect.top + "px";
                candle.style.zIndex = 100;
            }
        );
        candle.addEventListener(
            "pointermove",
            function(e) {
                if (!dragging) return;
                candle.style.left =
                    (e.clientX - offsetX) + "px";
                candle.style.top =
                    (e.clientY - offsetY) + "px";
                lamps.forEach(lamp => {
                    if (lamp.classList.contains("lit"))
                        return;
                    const lampRect =
                        lamp.getBoundingClientRect();
                    const candleRect =
                        candle.getBoundingClientRect();
                    const collision =
                        candleRect.left <
                        lampRect.right &&
                        candleRect.right >
                        lampRect.left &&
                        candleRect.top <
                        lampRect.bottom &&
                        candleRect.bottom >
                        lampRect.top;
                    if (collision) {
                        lightLamp(lamp);
                    }
                });
            }
        );
        candle.addEventListener(
            "pointerup",
            function(e) {

                dragging = false;

                candle.releasePointerCapture(
                    e.pointerId
                );

                candle.style.position =
                    "relative";
                candle.style.left = "";
                candle.style.top = "";
                candle.style.zIndex = "";
            }
        );

        let litCount = 0;
        let celebrationStarted = false;
        function lightLamp(lamp) {
            if (lamp.classList.contains("lit"))
                return;
            lamp.classList.add("lit");
            litCount++;

            if (litCount === 5) {

                startCelebration();
            }
        }

        function startCelebration() {
            if (celebrationStarted)
                return;
            celebrationStarted = true;
            document.querySelector(
                ".instruction"
            ).style.opacity = "0";
            startFireworks();
            setTimeout(() => {

                document
                    .getElementById("birthday")
                    .classList.add("show");

            }, 3000);
        }

        const canvas =
            document.getElementById("fireworks");

        const ctx =
            canvas.getContext("2d");

        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener(
            "resize",
            resizeCanvas
        );
        let fireworksRunning = false;
        let particles = [];
        let rockets = [];
        function createRocket() {
            rockets.push({
                x:
                    Math.random() *
                    canvas.width,
                y:
                    canvas.height + 10,
                targetY:
                    Math.random() *
                    canvas.height *
                    0.45 +
                    canvas.height *
                    0.15,
                speed:
                    Math.random() * 7 + 8,
                color:
                    `hsl(${Math.random() * 360}, 100%, 65%)`
            });
        }
        function explode(rocket) {
            const count = 80;
            for (let i = 0; i < count; i++) {
                const angle =
                    Math.random() *
                    Math.PI * 2;
                const speed =
                    Math.random() * 6 + 2;
                particles.push({
                    x: rocket.x,
                    y: rocket.y,
                    vx:
                        Math.cos(angle) *
                        speed,
                    vy:
                        Math.sin(angle) *
                        speed,
                    life: 1,
                    color: rocket.color
                });
            }
        }
        function animateFireworks() {
            if (!fireworksRunning)
                return;
            ctx.fillStyle =
                "rgba(1, 6, 17, 0.18)";
            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
            rockets.forEach(
                (rocket, index) => {
                    rocket.y -= rocket.speed;
                    ctx.beginPath();
                    ctx.arc(
                        rocket.x,
                        rocket.y,
                        2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fillStyle =
                        rocket.color;
                    ctx.fill();
                    if (
                        rocket.y <=
                        rocket.targetY
                    ) {
                        explode(rocket);
                        rockets.splice(index, 1);
                    }
                }
            );

            particles.forEach(
                (particle, index) => {
                    particle.x +=
                        particle.vx;
                    particle.y +=
                        particle.vy;
                    particle.vy +=
                        0.04;
                    particle.life -=
                        0.012;
                    ctx.globalAlpha =
                        particle.life;
                    ctx.beginPath();
                    ctx.arc(
                        particle.x,
                        particle.y,
                        2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fillStyle =
                        particle.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor =
                        particle.color;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    if (particle.life <= 0) {
                        particles.splice(
                            index,
                            1
                        );
                    }
                }
            );
            requestAnimationFrame(
                animateFireworks
            );
        }

        function startFireworks() {
            fireworksRunning = true;
            animateFireworks();

            setInterval(() => {

                createRocket();
            }, 550);
        }

        function baseBurst() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    createRocket();
                }, i * 200);
            }
        }

        setInterval(() => {
            if (fireworksRunning) {
                baseBurst();
            }
        }, 1800);
    </script>
</body>
</html>
