<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Wishes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #020817;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at center,
                rgba(0, 119, 255, 0.18),
                transparent 55%),
                #020817;
            z-index: -2;
        }
        .heart {
            position: absolute;
            top: -50px;
            color: #168cff;
            font-size: 20px;
            filter: drop-shadow(0 0 8px #008cff);
            animation: fall linear infinite;
            opacity: 0.8;
        }
        @keyframes fall {
            0% {
                transform: translateY(-60px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
        .register-box {
            width: 350px;
            padding: 40px;
            border-radius: 20px;

            background: rgba(5, 20, 45, 0.65);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(0, 153, 255, 0.5);

            box-shadow:
                0 0 20px rgba(0, 140, 255, 0.4),
                inset 0 0 20px rgba(0, 120, 255, 0.08);

            text-align: center;
        }
        .register-box h1 {
            margin-bottom: 8px;
            color: #4db8ff;
            text-shadow: 0 0 15px #008cff;
        }
        .register-box p {
            color: #9dccff;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-box {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #8ecbff;
            font-size: 14px;
        }
        .input-box input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #167dcc;
            outline: none;

            background: rgba(0, 20, 45, 0.7);
            color: white;

            box-shadow: 0 0 8px rgba(0, 140, 255, 0.2);
        }
        .input-box input:focus {
            border-color: #35aaff;
            box-shadow: 0 0 15px rgba(0, 153, 255, 0.6);
        }
        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #006eff,
                #00aaff
            );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 0 15px rgba(0, 140, 255, 0.6);

            transition: 0.3s;
        }
        .register-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.9);
        }
        .sparkle {
            position: fixed;
            pointer-events: none;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #63c7ff;

            box-shadow:
                0 0 5px #63c7ff,
                0 0 10px #009dff,
                0 0 20px #0077ff;

            animation: sparkleFade 0.8s ease-out forwards;
        }
        @keyframes sparkleFade {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(
                    calc(var(--x) * 1px),
                    calc(var(--y) * 1px)
                ) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="background" id="heartRain"></div>
    <div class="register-box">
        <h1>💙 REGISTER 💙</h1>
        <p>Create your account</p>
        <form>
            <div class="input-box">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="input-box">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>
            <button class="register-btn" type="submit">
                Register
            </button>
        </form>

    </div>
    <script>
        /* Create falling hearts */
        const heartRain = document.getElementById("heartRain");
        function createHeart() {
            const heart = document.createElement("div");

            heart.classList.add("heart");
            heart.innerHTML = "💙";

            heart.style.left = Math.random() * 100 + "vw";

            const size = Math.random() * 20 + 10;
            heart.style.fontSize = size + "px";

            const duration = Math.random() * 5 + 5;
            heart.style.animationDuration = duration + "s";

            heart.style.animationDelay =
                Math.random() * 2 + "s";

            heartRain.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, (duration + 2) * 1000);
        }
        setInterval(createHeart, 250);
        document.addEventListener("mousemove", function(e) {

            for (let i = 0; i < 2; i++) {

                const sparkle = document.createElement("div");

                sparkle.classList.add("sparkle");

                sparkle.style.left = e.clientX + "px";
                sparkle.style.top = e.clientY + "px";

                sparkle.style.setProperty(
                    "--x",
                    (Math.random() - 0.5) * 80
                );

                sparkle.style.setProperty(
                    "--y",
                    (Math.random() - 0.5) * 80
                );

                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 800);
            }
        });
        document.querySelector("form").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("Registration successful! 💙");
        });
    </script>

</body>
</html>
