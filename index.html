<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Wishes 💙</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top, #123b78, #06152f 65%, #020817);
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 430px;
            padding: 35px 25px;
            text-align: center;
            border: 1px solid rgba(125, 190, 255, 0.5);
            border-radius: 22px;
            background: rgba(5, 24, 55, 0.75);
            box-shadow:
                0 0 20px rgba(0, 136, 255, 0.5),
                0 0 45px rgba(0, 136, 255, 0.2);
            backdrop-filter: blur(10px);
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            font-size: clamp(25px, 6vw, 34px);
            color: #a9d9ff;
            text-shadow: 0 0 15px #168cff;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 14px;
            color: #d4eaff;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Form */
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d9ecff;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #4ba7ff;
            border-radius: 10px;
            outline: none;
            color: white;
            background: rgba(0, 18, 45, 0.85);
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #a4dcff;
            box-shadow: 0 0 15px rgba(0, 145, 255, 0.7);
        }

        input::placeholder {
            color: #8faacb;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(1);
        }

        /* Continue button */
        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            color: white;
            background: linear-gradient(90deg, #087cff, #00b7ff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 145, 255, 0.5);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 28px rgba(0, 183, 255, 0.9);
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 16px;
            color: #a9dcff;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #9bbfe8;
        }

        /* Falling hearts */
        .heart {
            position: fixed;
            top: -40px;
            z-index: 1;
            color: #64baff;
            text-shadow: 0 0 12px #168cff;
            pointer-events: none;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(115vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glitter particles */
        .sparkle {
            position: fixed;
            z-index: 1;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #d5efff;
            box-shadow:
                0 0 6px #8bcaff,
                0 0 12px #168cff;
            pointer-events: none;
            animation: glitter 2s ease-in-out infinite alternate;
        }

        @keyframes glitter {
            from {
                opacity: 0.2;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Hii Darling💙🌏!!!</h1>

        <p class="subtitle">
            A little surprise is waiting for you... ✨<br>
            Enter your details to continue 💙
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="name">Your Name 💙</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="dob">Your Date of Birth 🎂</label>
                <input
                    type="date"
                    id="dob"
                    required
                >
            </div>

            <button type="submit">Continue 💙 →</button>

        </form>

        <p id="message" aria-live="polite"></p>

        <p class="footer">
            It's my small effort for youhh ♡
        </p>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const nameInput = document.getElementById("name");
        const dobInput = document.getElementById("dob");
        const message = document.getElementById("message");

        // Set today's date as the maximum selectable date
        const today = new Date();
        const localToday =
            today.getFullYear() + "-" +
            String(today.getMonth() + 1).padStart(2, "0") + "-" +
            String(today.getDate()).padStart(2, "0");

        dobInput.max = localToday;

        // Continue to the second page
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = nameInput.value.trim();
            const dob = dobInput.value;

            // Check that both fields are entered
            if (!name || !dob) {
                message.textContent =
                    "💙 Please enter your name and date of birth.";
                return;
            }

            // Prevent future dates
            if (dob > localToday) {
                message.textContent =
                    "✨ Please enter a valid date of birth.";
                return;
            }

            // Save details for the next page
            sessionStorage.setItem("birthdayUserName", name);
            sessionStorage.setItem("birthdayUserDOB", dob);

            // Open the second page
            window.location.href = "home_page.html";
        });

        // Create falling hearts
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "heart";
            heart.textContent = "♡";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (15 + Math.random() * 22) + "px";
            heart.style.animationDuration = (5 + Math.random() * 6) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 11000);
        }

        // Create a heart every 350 milliseconds
        setInterval(createHeart, 350);

        // Create glitter particles
        function createSparkle() {
            const sparkle = document.createElement("div");

            sparkle.className = "sparkle";
            sparkle.style.left = Math.random() * 100 + "vw";
            sparkle.style.top = Math.random() * 100 + "vh";
            sparkle.style.animationDelay = Math.random() * 2 + "s";

            document.body.appendChild(sparkle);
        }

        // Change 60 to increase the number of glitter particles
        for (let i = 0; i < 60; i++) {
            createSparkle();
        }
    </script>

</body>
</html>
