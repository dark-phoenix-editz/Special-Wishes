<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 💙</title>

    <style>
        /* ===== RESET AND PAGE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
            color: white;
            background: radial-gradient(circle at top, #063b91, #020b29 75%);
        }

        /* ===== SHARED BACKGROUND EFFECTS ===== */
        #background,
        #effects {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        #background {
            z-index: 0;
        }

        #effects {
            z-index: 2;
        }

        .heart {
            position: absolute;
            top: -50px;
            color: #19baff;
            text-shadow: 0 0 15px #008cff;
            animation: fall linear infinite;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 10px 3px #168cff;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            100% {
                transform: translateY(115vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1.5); }
        }

        /* ===== MAIN BIRTHDAY CARD ===== */
        .container {
            position: relative;
            z-index: 1;
            width: min(92%, 760px);
            padding: 30px 24px;
            text-align: center;
            border: 1px solid rgba(69, 177, 255, 0.65);
            border-radius: 30px;
            background: rgba(0, 25, 85, 0.48);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 35px rgba(0, 140, 255, 0.22);
        }

        .small-title {
            color: #75ceff;
            font-size: 1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .birthday-title {
            color: #9ce4ff;
            font-family: Georgia, serif;
            font-style: italic;
            font-size: clamp(2.6rem, 8vw, 5rem);
            line-height: 1.12;
            text-shadow: 0 0 12px #008cff, 0 0 30px rgba(0, 140, 255, 0.8);
            opacity: 0;
            transform: translateY(18px) scale(0.96);
        }

        .birthday-title.show {
            animation: titleReveal 1s ease forwards;
        }

        .name {
            display: block;
            margin-top: 10px;
            color: #ffffff;
            overflow-wrap: anywhere;
        }

        .message {
            margin: 22px auto 0;
            color: #c2eaff;
            font-size: clamp(1rem, 3vw, 1.2rem);
            line-height: 1.7;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .message.show {
            opacity: 1;
        }

        @keyframes titleReveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== HEART BALLOONS ===== */
        #balloons {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            font-size: clamp(36px, 6vw, 65px);
            filter: drop-shadow(0 0 12px rgba(35, 160, 255, 0.75));
            animation: balloonRise 5s ease-in forwards;
        }

        .balloon::after {
            content: "";
            position: absolute;
            top: 80%;
            left: 50%;
            height: 45px;
            border-left: 1px solid rgba(210, 239, 255, 0.65);
        }

        @keyframes balloonRise {
            0% {
                transform: translateY(0) rotate(-8deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            50% { transform: translateY(-55vh) rotate(8deg); }
            100% {
                transform: translateY(-125vh) rotate(-5deg);
                opacity: 0;
            }
        }

        /* ===== CONFETTI ===== */
        .confetti {
            position: absolute;
            top: -20px;
            width: 9px;
            height: 14px;
            opacity: 0.95;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-5vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(900deg);
                opacity: 0;
            }
        }

        /* ===== FIREWORKS ===== */
        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            animation: fireworkBurst 850ms ease-out forwards;
        }

        @keyframes fireworkBurst {
            0% {
                opacity: 1;
                box-shadow: 0 0 0 0 currentColor;
                transform: scale(0.3);
            }
            100% {
                opacity: 0;
                box-shadow:
                    0 -45px 0 1px currentColor,
                    32px -32px 0 1px currentColor,
                    45px 0 0 1px currentColor,
                    32px 32px 0 1px currentColor,
                    0 45px 0 1px currentColor,
                    -32px 32px 0 1px currentColor,
                    -45px 0 0 1px currentColor,
                    -32px -32px 0 1px currentColor,
                    0 -25px 0 3px currentColor,
                    18px -18px 0 2px currentColor,
                    25px 0 0 3px currentColor,
                    18px 18px 0 2px currentColor,
                    0 25px 0 3px currentColor,
                    -18px 18px 0 2px currentColor,
                    -25px 0 0 3px currentColor,
                    -18px -18px 0 2px currentColor;
                transform: scale(1);
            }
        }

        /* ===== NEXT BUTTON ===== */
        .next-btn {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 35px;
            border: 1px solid #7edcff;
            border-radius: 999px;
            background: linear-gradient(100deg, #087cff, #05c5ff);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 0 22px rgba(0, 153, 255, 0.55);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: 0.3s ease;
        }

        .next-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 32px #008cff;
        }

        .footer {
            margin-top: 22px;
            color: #63caff;
            font-family: Georgia, serif;
            font-style: italic;
            font-size: 0.95rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 17px;
            }
            .small-title {
                font-size: 0.78rem;
                letter-spacing: 0.14em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <!-- Background hearts and glitter -->
    <div id="background" aria-hidden="true"></div>

    <!-- Temporary celebration effects -->
    <div id="balloons" aria-hidden="true"></div>
    <div id="effects" aria-hidden="true"></div>

    <main class="container">
        <p class="small-title">A little celebration made just for you</p>

        <h1 class="birthday-title" id="birthdayTitle">
            Happy Birthday!
            <span class="name" id="birthdayName">Someone Special 💙</span>
        </h1>

        <p class="message" id="birthdayMessage">
            May your day be filled with love, laughter, and beautiful memories. 💙
        </p>

        <a class="next-btn" id="nextButton" href="next_page.html">
            NEXT 💙 →
        </a>

        <p class="footer">You deserve all the happiness in the world ♡</p>
    </main>

    <script>
        // ===== READ THE NAME FROM PAGE ONE =====
        const savedName = sessionStorage.getItem("birthdayUserName");
        const birthdayName = document.getElementById("birthdayName");

        if (savedName && savedName.trim()) {
            // Use textContent so the entered name is displayed safely.
            birthdayName.textContent = savedName.trim() + " 💙";
        } else {
            birthdayName.textContent = "Someone Special 💙";
        }

        // ===== CREATE THE CONTINUOUS BACKGROUND =====
        const background = document.getElementById("background");

        for (let i = 0; i < 35; i++) {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent = Math.random() > 0.5 ? "♡" : "💙";
            heart.style.left = Math.random() * 100 + "%";
            heart.style.fontSize = (15 + Math.random() * 20) + "px";
            heart.style.animationDuration = (6 + Math.random() * 9) + "s";
            heart.style.animationDelay = (-Math.random() * 15) + "s";
            background.appendChild(heart);
        }

        for (let i = 0; i < 65; i++) {
            const sparkle = document.createElement("div");
            sparkle.className = "sparkle";
            sparkle.style.left = Math.random() * 100 + "%";
            sparkle.style.top = Math.random() * 100 + "%";
            sparkle.style.animationDelay = Math.random() * 3 + "s";
            background.appendChild(sparkle);
        }

        // ===== CONFETTI BURST FOR 3 SECONDS =====
        const effects = document.getElementById("effects");
        const colors = ["#55d8ff", "#ffffff", "#ff72c6", "#ffe66d", "#8b7bff", "#7dffcf"];

        function createConfetti() {
            const piece = document.createElement("div");
            piece.className = "confetti";
            piece.style.left = Math.random() * 100 + "vw";
            piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDuration = (1.8 + Math.random() * 1.5) + "s";
            piece.style.transform = "rotate(" + Math.random() * 360 + "deg)";
            effects.appendChild(piece);

            setTimeout(() => piece.remove(), 3500);
        }

        const confettiInterval = setInterval(createConfetti, 35);

        // ===== HEART BALLOONS FOR 5 SECONDS =====
        const balloons = document.getElementById("balloons");
        const balloonEmojis = ["💙", "🩵", "💗", "💖", "💕"];

        function createBalloon() {
            const balloon = document.createElement("div");
            balloon.className = "balloon";
            balloon.textContent = balloonEmojis[Math.floor(Math.random() * balloonEmojis.length)];
            balloon.style.left = (5 + Math.random() * 90) + "%";
            balloon.style.animationDuration = (4.2 + Math.random() * 1.4) + "s";
            balloons.appendChild(balloon);

            setTimeout(() => balloon.remove(), 6000);
        }

        // ===== FIREWORKS =====
        function createFirework() {
            const firework = document.createElement("div");
            firework.className = "firework";
            firework.style.left = (10 + Math.random() * 80) + "vw";
            firework.style.top = (10 + Math.random() * 65) + "vh";
            firework.style.color = colors[Math.floor(Math.random() * colors.length)];
            effects.appendChild(firework);

            setTimeout(() => firework.remove(), 900);
        }

        // ===== RUN THE CELEBRATION SEQUENCE =====
        const birthdayTitle = document.getElementById("birthdayTitle");
        const birthdayMessage = document.getElementById("birthdayMessage");
        const nextButton = document.getElementById("nextButton");

        // First 3 seconds: confetti only.
        setTimeout(() => {
            clearInterval(confettiInterval);

            // Remove any remaining confetti.
            document.querySelectorAll(".confetti").forEach(piece => piece.remove());

            // Reveal the birthday greeting.
            birthdayTitle.classList.add("show");
            birthdayMessage.classList.add("show");

            // Start balloons and fireworks for 5 seconds.
            createBalloon();
            const balloonInterval = setInterval(createBalloon, 250);

            createFirework();
            const fireworkInterval = setInterval(createFirework, 420);

            setTimeout(() => {
                clearInterval(balloonInterval);
                clearInterval(fireworkInterval);

                // Show NEXT after the 5-second celebration.
                nextButton.classList.add("show");
            }, 5000);
        }, 3000);
    </script>
</body>
</html>
